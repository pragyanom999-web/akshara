<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b174d" />
  <meta name="description" content="Akshara — Learn, Grow, Achieve." />
  <title>Akshara — Learning Platform</title>

  <style>
    :root{
      --navy:#0b174d;
      --navy-2:#172665;
      --blue:#3159d9;
      --coral:#ff6b5d;
      --text:#10204f;
      --muted:#66769c;
      --line:#e7ecf7;
      --surface:#ffffff;
      --bg:#f7f9fe;
      --shadow:0 14px 38px rgba(25,48,105,.08);
      --radius:24px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:linear-gradient(180deg,#fbfcff 0%,#f5f8ff 100%);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,a{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}

    .app{
      width:min(100%,1180px);
      margin:auto;
      min-height:100vh;
      padding:22px 28px 100px;
    }

    /* Header */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      margin-bottom:22px;
    }

    .brand{
      display:flex;
      align-items:center;
      min-width:0;
    }

    .brand img{
      width:58px;
      height:58px;
      object-fit:contain;
      flex:none;
    }

    .brand-copy{margin-left:12px}
    .brand-name{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(31px,4vw,52px);
      line-height:.95;
      letter-spacing:-1.5px;
      color:#14266b;
    }

    .tagline{
      margin:7px 0 0;
      color:#60729b;
      font-size:15px;
      letter-spacing:.2px;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .icon-btn{
      position:relative;
      width:48px;
      height:48px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:var(--navy);
      display:grid;
      place-items:center;
      transition:.2s ease;
    }

    .icon-btn:hover{background:#eef2fc;transform:translateY(-1px)}
    .icon-btn svg{width:27px;height:27px}
    .notification-dot{
      position:absolute;
      top:8px;
      right:8px;
      width:10px;
      height:10px;
      border:2px solid #fff;
      border-radius:50%;
      background:var(--coral);
    }

    .avatar{
      width:48px;
      height:48px;
      border-radius:50%;
      background:#eaf0ff;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .avatar svg{width:39px;height:39px}

    /* Hero */
    .hero{
      position:relative;
      min-height:365px;
      overflow:hidden;
      border-radius:30px;
      padding:48px;
      color:#fff;
      background:
        radial-gradient(circle at 80% 35%,rgba(64,87,193,.45),transparent 28%),
        radial-gradient(circle at 58% 105%,rgba(46,72,171,.45),transparent 35%),
        linear-gradient(135deg,#081441 0%,#172766 100%);
      box-shadow:0 18px 45px rgba(10,25,78,.17);
    }

    .hero:before,
    .hero:after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.04);
      pointer-events:none;
    }
    .hero:before{width:430px;height:430px;right:-100px;top:-120px}
    .hero:after{width:350px;height:350px;right:150px;bottom:-240px}

    .hero-content{position:relative;z-index:2;max-width:590px}
    .eyebrow{
      font-size:14px;
      font-weight:700;
      letter-spacing:2.5px;
      text-transform:uppercase;
      color:#dce4ff;
      margin:0 0 18px;
    }

    .hero h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(42px,6vw,72px);
      line-height:.98;
      letter-spacing:-2px;
    }

    .hero h1 span{color:#ff776a}
    .hero p{
      max-width:510px;
      margin:22px 0 28px;
      color:#dce4f9;
      font-size:18px;
      line-height:1.55;
    }

    .primary-btn{
      border:0;
      padding:15px 22px;
      border-radius:999px;
      background:linear-gradient(135deg,#ff7569,#ff5f52);
      color:#fff;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      gap:13px;
      box-shadow:0 12px 25px rgba(255,104,91,.25);
      transition:.2s ease;
    }
    .primary-btn:hover{transform:translateY(-2px);box-shadow:0 15px 28px rgba(255,104,91,.32)}
    .primary-btn svg{width:19px;height:19px}

    .hero-illustration{
      position:absolute;
      z-index:1;
      right:45px;
      top:55px;
      width:min(42%,390px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .book{
      position:relative;
      width:75%;
      height:48%;
      transform:perspective(600px) rotateX(8deg);
      filter:drop-shadow(0 20px 22px rgba(0,0,0,.2));
    }

    .book .page{
      position:absolute;
      top:0;
      width:50%;
      height:100%;
      background:#fffaf0;
      border-bottom:9px solid var(--coral);
    }
    .book .left{
      left:0;
      border-radius:15px 4px 4px 28px;
      transform:skewY(18deg);
    }
    .book .right{
      right:0;
      border-radius:4px 15px 28px 4px;
      transform:skewY(-18deg);
    }
    .book .center{
      position:absolute;
      left:50%;
      top:-12px;
      width:7px;
      height:108%;
      background:#fffaf0;
      transform:translateX(-50%);
      border-radius:50%;
    }
    .spark{
      position:absolute;
      width:35px;height:35px;
      background:#ff7868;
      transform:rotate(45deg);
      top:-52px;
      left:50%;
      margin-left:-17px;
      border-radius:5px;
      box-shadow:0 0 35px rgba(255,120,104,.4);
    }
    .spark:after{
      content:"";
      position:absolute;
      inset:-18px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.55);
    }

    .dots{
      position:absolute;
      right:42px;
      bottom:25px;
      display:flex;
      gap:11px;
      z-index:2;
    }
    .dots span{width:12px;height:12px;border-radius:50%;background:#aebbe0}
    .dots .active{background:var(--coral)}

    /* Quick actions */
    .quick-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
      margin:24px 0;
    }

    .quick-card{
      border:1px solid #eef1f8;
      background:rgba(255,255,255,.92);
      border-radius:24px;
      min-height:180px;
      padding:22px 14px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      box-shadow:var(--shadow);
      transition:.2s ease;
    }
    .quick-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(25,48,105,.12)}
    .quick-icon{
      width:70px;height:70px;border-radius:19px;
      display:grid;place-items:center;margin-bottom:14px;
    }
    .quick-icon svg{width:34px;height:34px}
    .q-blue{background:#e9efff;color:#3159d9}
    .q-coral{background:#ffebea;color:#ff5e52}
    .q-green{background:#ddf7ef;color:#0baf7c}
    .q-purple{background:#f0eaff;color:#7042d6}
    .quick-card h3{font-size:18px;line-height:1.25;margin:0;font-weight:800}

    /* Section/card */
    .section-card{
      background:#fff;
      border:1px solid #edf1f8;
      border-radius:28px;
      padding:30px;
      box-shadow:var(--shadow);
      margin-bottom:26px;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:22px;
    }

    .section-head h2,
    .subject-heading h2{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:32px;
      letter-spacing:-.8px;
      color:#112152;
    }

    .view-all{
      color:#3159d9;
      font-weight:800;
      display:flex;
      align-items:center;
      gap:5px;
    }
    .view-all svg{width:18px}

    .lesson{
      display:grid;
      grid-template-columns:220px 1fr auto;
      align-items:center;
      gap:25px;
      padding:18px;
      border-radius:22px;
      background:#f5f7fd;
    }

    .lesson-thumb{
      min-height:150px;
      border-radius:18px;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 20%,#31447f,transparent 25%),
        linear-gradient(145deg,#14275e,#0a1743);
    }

    .flask{
      position:relative;
      width:65px;height:75px;
      border:5px solid #fff;
      border-top:0;
      border-radius:8px 8px 30px 30px;
      background:linear-gradient(to top,rgba(255,92,80,.95) 0 48%,transparent 49%);
    }
    .flask:before{
      content:"";
      position:absolute;
      width:25px;height:22px;
      border:5px solid #fff;
      border-bottom:0;
      left:50%;
      top:-25px;
      transform:translateX(-50%);
      border-radius:4px 4px 0 0;
    }
    .bubble{position:absolute;border-radius:50%;background:#fff}
    .bubble.b1{width:7px;height:7px;left:15px;top:20px}
    .bubble.b2{width:5px;height:5px;right:12px;top:7px}
    .bubble.b3{width:8px;height:8px;right:-12px;top:30px}

    .lesson-label{
      margin:0 0 8px;
      color:#6b80d7;
      font-weight:800;
      font-size:14px;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }
    .lesson h3{
      margin:0;
      font-size:23px;
      line-height:1.3;
    }

    .progress-row{
      display:flex;
      align-items:center;
      gap:15px;
      margin-top:22px;
    }
    .progress{
      flex:1;
      height:10px;
      background:#dfe4f0;
      border-radius:99px;
      overflow:hidden;
    }
    .progress span{
      display:block;
      width:38%;
      height:100%;
      background:linear-gradient(90deg,#ff7a6c,#ff6256);
      border-radius:inherit;
    }
    .progress-text{color:#607098;font-size:14px;white-space:nowrap}

    .round-arrow{
      width:54px;height:54px;border:0;border-radius:50%;
      background:#e9efff;color:#3159d9;display:grid;place-items:center;
    }
    .round-arrow svg{width:22px}

    /* Subjects */
    .subject-heading{margin:0 0 20px}
    .subject-heading p{margin:7px 0 0;color:#66769c;font-size:17px}
    .subjects{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }
    .subject{
      position:relative;
      min-height:160px;
      border-radius:22px;
      padding:22px;
      border:1px solid var(--line);
      background:#fff;
      overflow:hidden;
      transition:.2s ease;
    }
    .subject:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .subject .subject-icon{
      width:52px;height:52px;border-radius:50%;
      display:grid;place-items:center;margin-bottom:14px;
    }
    .subject .subject-icon svg{width:26px;height:26px}
    .subject h3{margin:0 0 7px;font-size:19px}
    .subject p{margin:0;color:#68789c;font-size:14px}
    .subject .chevron{
      position:absolute;right:20px;bottom:23px;color:#50668f
    }
    .math{background:#f7f9ff;border-color:#dfe7ff}.math .subject-icon{background:#dce6ff;color:#3159d9}
    .science{background:#fff9f8;border-color:#ffe2de}.science .subject-icon{background:#ffd8d2;color:#f05e51}
    .english{background:#f6fcfa;border-color:#d9f1e8}.english .subject-icon{background:#c7f1e3;color:#0da977}
    .social{background:#fbf8ff;border-color:#eadfff}.social .subject-icon{background:#e2d3ff;color:#7042d6}
    .assamese{background:#fffdf7;border-color:#f7e9c8}.assamese .subject-icon{background:#ffe4a8;color:#d49300}
    .more{background:#f7faff;border-color:#dbe8ff}.more .subject-icon{background:#cfe1ff;color:#3575df}

    /* Bottom nav */
    .bottom-nav{
      position:fixed;
      z-index:50;
      left:50%;
      bottom:15px;
      transform:translateX(-50%);
      width:min(calc(100% - 30px),720px);
      padding:10px 12px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:4px;
      background:rgba(255,255,255,.93);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid #e5eaf4;
      box-shadow:0 16px 45px rgba(25,48,105,.18);
      border-radius:25px;
    }
    .nav-item{
      border:0;background:transparent;color:#71809e;
      min-height:60px;border-radius:17px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;font-size:12px;font-weight:700;
    }
    .nav-item svg{width:24px;height:24px}
    .nav-item.active{color:#3159d9;background:#f0f4ff}
    .nav-item.active:after{
      content:"";
      position:absolute;
      bottom:6px;
      width:54px;height:3px;border-radius:5px;background:#3159d9;
    }

    .toast{
      position:fixed;
      z-index:100;
      left:50%;bottom:100px;
      transform:translate(-50%,20px);
      opacity:0;pointer-events:none;
      background:#0b174d;color:#fff;
      padding:12px 18px;border-radius:999px;
      font-size:14px;font-weight:700;
      transition:.25s ease;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    /* Responsive */
    @media (max-width:850px){
      .app{padding:16px 16px 100px}
      .hero{padding:34px;min-height:410px}
      .hero-illustration{opacity:.9;right:-20px;top:90px;width:46%}
      .quick-grid{gap:12px}
      .quick-card{min-height:160px}
      .lesson{grid-template-columns:170px 1fr}
      .lesson .round-arrow{display:none}
      .subjects{grid-template-columns:repeat(2,1fr)}
    }

    @media (max-width:600px){
      .app{padding:12px 12px 94px}
      .topbar{margin-bottom:14px}
      .brand img{width:48px;height:48px}
      .brand-copy{margin-left:8px}
      .brand-name{font-size:31px}
      .tagline{font-size:11px;margin-top:5px}
      .top-actions{gap:2px}
      .icon-btn{width:42px;height:42px}
      .avatar{width:42px;height:42px}
      .avatar svg{width:34px;height:34px}

      .hero{
        min-height:455px;
        padding:28px 24px;
        border-radius:25px;
      }
      .eyebrow{font-size:11px;letter-spacing:1.8px;max-width:200px}
      .hero h1{font-size:43px;max-width:330px}
      .hero p{font-size:15px;max-width:290px}
      .hero-illustration{
        width:230px;
        right:-24px;
        top:235px;
        opacity:.9;
      }
      .dots{right:24px;bottom:20px}

      .quick-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        margin:14px 0;
      }
      .quick-card{
        min-height:145px;
        padding:17px 8px;
        border-radius:20px;
      }
      .quick-icon{width:58px;height:58px;margin-bottom:10px}
      .quick-icon svg{width:28px;height:28px}
      .quick-card h3{font-size:15px}

      .section-card{padding:20px;border-radius:23px;margin-bottom:16px}
      .section-head h2,.subject-heading h2{font-size:27px}
      .view-all{font-size:13px}
      .lesson{grid-template-columns:1fr;padding:12px;gap:15px}
      .lesson-thumb{min-height:145px}
      .lesson h3{font-size:18px}
      .progress-row{display:block}
      .progress-text{display:block;margin-top:8px}
      .subjects{grid-template-columns:1fr 1fr;gap:10px}
      .subject{min-height:145px;padding:16px;border-radius:19px}
      .subject .subject-icon{width:44px;height:44px;margin-bottom:10px}
      .subject .subject-icon svg{width:22px;height:22px}
      .subject h3{font-size:15px}
      .subject p{font-size:12px}
      .subject .chevron{right:14px;bottom:17px}

      .bottom-nav{
        bottom:8px;
        width:calc(100% - 16px);
        border-radius:21px;
        padding:7px 5px;
      }
      .nav-item{min-height:54px;font-size:10px}
      .nav-item svg{width:22px;height:22px}
      .nav-item.active:after{bottom:4px;width:42px}
    }

    @media (max-width:390px){
      .hero h1{font-size:38px}
      .hero{min-height:440px}
      .hero-illustration{top:245px;width:205px}
      .subjects{grid-template-columns:1fr}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <a href="#" class="brand" aria-label="Akshara home">
        <img src="logo.png" alt="Akshara logo" onerror="this.style.display='none'" />
        <div class="brand-copy">
          <h1 class="brand-name">Akshara</h1>
          <p class="tagline">Learn · Grow · Achieve</p>
        </div>
      </a>

      <div class="top-actions">
        <button class="icon-btn" aria-label="Search" data-toast="Search is ready to connect.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>

        <button class="icon-btn" aria-label="Notifications" data-toast="No new notifications.">
          <span class="notification-dot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
        </button>

        <button class="avatar" aria-label="Profile" data-toast="Profile page is ready to connect.">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="24" fill="#dbe5ff"/>
            <circle cx="24" cy="18" r="8" fill="#f4c49d"/>
            <path d="M14 40c1-8 5-12 10-12s9 4 10 12" fill="#15265d"/>
            <path d="M16 17c1-7 14-9 17 1-3-2-7-4-17-1z" fill="#14204c"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="hero" aria-label="Akshara introduction">
      <div class="hero-content">
        <p class="eyebrow">Your learning journey starts here</p>
        <h1>Better Learning<br><span>Brighter Future</span></h1>
        <p>Study at your pace, achieve your dreams with Akshara.</p>
        <button class="primary-btn" data-toast="Courses will open here.">
          Explore Courses
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M5 12h13"></path><path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>
      </div>

      <div class="hero-illustration" aria-hidden="true">
        <div class="book">
          <div class="spark"></div>
          <div class="page left"></div>
          <div class="page right"></div>
          <div class="center"></div>
        </div>
      </div>

      <div class="dots" aria-hidden="true">
        <span class="active"></span><span></span><span></span>
      </div>
    </section>

    <section class="quick-grid" aria-label="Quick access">
      <button class="quick-card" data-toast="Video lessons selected.">
        <span class="quick-icon q-blue">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z" fill="white"/></svg>
        </span>
        <h3>Video<br>Lessons</h3>
      </button>

      <button class="quick-card" data-toast="Study materials selected.">
        <span class="quick-icon q-coral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        </span>
        <h3>Study<br>Materials</h3>
      </button>

      <button class="quick-card" data-toast="Practice tests selected.">
        <span class="quick-icon q-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 9 1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 10h3M14 16h3"/></svg>
        </span>
        <h3>Practice<br>Tests</h3>
      </button>

      <button class="quick-card" data-toast="Performance analytics selected.">
        <span class="quick-icon q-purple">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="13" width="3.5" height="7" rx="1"/><rect x="10.25" y="9" width="3.5" height="11" rx="1"/><rect x="16.5" y="4" width="3.5" height="16" rx="1"/></svg>
